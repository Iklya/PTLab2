
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Добавление покупателя</title>
    <link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>
<body>

<header class="header">
    <div class="container">
        <a href="/" class="logo">Магазин</a>
    </div>
</header>

<main class="container form-container">
    <div class="form-card">
        <h1>Новый покупатель</h1>
        <p class="muted">Заполните информацию о покупателе.</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="button button-primary full-width">
                Добавить покупателя
            </button>
        </form>

        <a href="/" class="back-link">Вернуться в магазин</a>
    </div>
</main>

</body>
</html>
